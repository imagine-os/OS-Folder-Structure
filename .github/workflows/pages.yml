name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Actions token in this org cannot call the Pages REST API
# ("Resource not accessible by integration"), so instead of
# configure-pages/deploy-pages we publish the site root to the gh-pages
# branch with plain git, which enables GitHub Pages for a public repo.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site root to gh-pages
        run: |
          set -euo pipefail
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force origin gh-pages
