<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaOS Explorer</title>
<style>
:root{
  --bg:#EDF2F7; --panel:#FFFFFF; --panel2:#F5F8FC; --ink:#14213D; --muted:#5B6B82; --line:#D5DEE8;
  --accent:#2456E6; --accent-ink:#FFFFFF; --accent-soft:#E3ECFB; --sun:#F2A100; --sun-soft:#FFF3D6;
  --mark:#FFE58A; --shadow:0 8px 24px rgba(20,33,61,.10); --fs:62%; --fl:44%; --fl2:92%;
  --radius:14px; --font:"Segoe UI","Trebuchet MS",Avenir,"Helvetica Neue",system-ui,-apple-system,sans-serif;
  --display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Avenir,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --panel:#172035; --panel2:#1C2740; --ink:#E6EDF7; --muted:#96A5BF; --line:#2A3752;
    --accent:#7BA2FF; --accent-ink:#0E1524; --accent-soft:#213258; --sun:#FFC53D; --sun-soft:#3A2F12;
    --mark:#7A5B00; --shadow:0 8px 24px rgba(0,0,0,.35); --fs:70%; --fl:70%; --fl2:20%;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --panel:#172035; --panel2:#1C2740; --ink:#E6EDF7; --muted:#96A5BF; --line:#2A3752;
  --accent:#7BA2FF; --accent-ink:#0E1524; --accent-soft:#213258; --sun:#FFC53D; --sun-soft:#3A2F12;
  --mark:#7A5B00; --shadow:0 8px 24px rgba(0,0,0,.35); --fs:70%; --fl:70%; --fl2:20%;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:16px;padding-block:12px;gap:12px}
/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--sun));display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.search{flex:1 1 220px;min-width:160px;position:relative}
.search input{width:100%;height:42px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);padding:0 40px 0 40px;font-size:15px}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:12px;top:0;height:42px;display:grid;place-items:center;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:6px;top:5px;height:32px;width:32px;border-radius:8px;color:var(--muted)}
.search .clear:hover{background:var(--accent-soft)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.seg button{height:38px;padding:0 12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.sun button[aria-pressed="true"]{background:var(--sun);color:#1a1a1a}
.iconbtn{height:42px;min-width:42px;padding:0 12px;border:2px solid var(--line);border-radius:12px;background:var(--panel2);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--accent)}
.only-mobile{display:none}

/* ---------- workspace ---------- */
.work{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:12px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pane-head .spacer{flex:1}
.pane-head button{height:30px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--panel2);border:1px solid var(--line)}
.pane-head button:hover{border-color:var(--accent)}
.tree{overflow:auto;padding:8px;flex:1;scrollbar-width:thin}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{padding-left:18px;border-left:2px dashed var(--line);margin-left:15px}
.tree li{margin:1px 0}
.node{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 8px 4px 4px;border-radius:10px;cursor:pointer;user-select:none}
.node:hover{background:var(--accent-soft)}
.node[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.node[aria-selected="true"] .grown{color:inherit;opacity:.8}
.node .tw{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--muted);flex:none;font-size:11px;transition:transform .15s}
.node[aria-selected="true"] .tw{color:inherit}
.node .tw.leaf{opacity:.35}
.node[aria-expanded="true"] .tw{transform:rotate(90deg)}
.node .ic{font-size:20px;width:28px;text-align:center;flex:none;line-height:1}
.node .lbl{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.node .kid{font-weight:600;font-size:14px}
.node .grown{font-size:11px;color:var(--muted)}
.tree li[hidden]{display:none}
.tree .top-node{margin-top:4px}
.tree .top-node > .node{font-family:var(--display)}
.tree .top-node > .node .kid{font-size:15px}
.tree .top-node > .node::before{content:"";width:5px;height:26px;border-radius:3px;background:hsl(var(--h) var(--fs) var(--fl));flex:none;margin-right:2px}
.empty{padding:20px;color:var(--muted);text-align:center}

/* ---------- detail ---------- */
.detail{overflow:auto;flex:1;padding:18px 22px 40px;scrollbar-width:thin}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--muted);margin-bottom:12px}
.crumbs button{padding:4px 8px;border-radius:8px;color:var(--ink);font-weight:600}
.crumbs button:hover{background:var(--accent-soft)}
.crumbs .sep{opacity:.5}
.crumbs .here{padding:4px 8px;font-weight:700;color:var(--ink);background:var(--panel2);border-radius:8px}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.hero .big{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;font-size:42px;background:hsl(var(--h) var(--fs) var(--fl2));border:2px solid hsl(var(--h) var(--fs) var(--fl));flex:none}
.hero h1{margin:0;font-family:var(--display);font-size:clamp(22px,3vw,32px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.hero .gname{color:var(--muted);font-size:14px;margin-top:4px;font-family:var(--mono)}
.hero .folderpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:6px;background:hsl(var(--h) var(--fs) var(--fl2));color:hsl(var(--h) var(--fs) var(--fl))}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:16px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card.kidcard{grid-column:1/-1;background:var(--sun-soft);border-color:color-mix(in srgb,var(--sun) 45%,transparent);font-size:clamp(17px,2vw,21px);line-height:1.45;font-family:var(--display);font-weight:600}
.card h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.card p{margin:0}
details.grown{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:16px}
details.grown summary{cursor:pointer;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none;min-height:46px}
details.grown summary::-webkit-details-marker{display:none}
details.grown summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.grown[open] summary::before{transform:rotate(90deg)}
details.grown .body{padding:0 16px 16px;line-height:1.6;max-width:75ch}
details.grown .body code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
.sect h2{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px 4px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-weight:600;font-size:14px}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip small{color:var(--muted);font-weight:500;font-size:11px}
.grid-files{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.file{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);min-height:96px}
.file:hover{border-color:var(--accent);background:var(--accent-soft)}
.file .fi{font-size:30px;line-height:1}
.file .fk{font-weight:700;font-size:14px;line-height:1.2}
.file .fg{font-size:11px;color:var(--muted)}
.file .fc{font-size:11px;color:var(--muted);margin-top:auto}
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:8px}
.diagram svg{display:block;max-width:100%;height:auto;margin:0 auto}
.diagram text{font-family:var(--font);fill:var(--ink)}
.diagram .lk{cursor:pointer}
.diagram .lk:hover rect{stroke:var(--accent);stroke-width:3}
body[data-level="kid"] .kid-hide{display:none}

/* ---------- map ---------- */
.map{overflow:auto;flex:1;padding:18px 22px 30px}
.map h1{font-family:var(--display);margin:0 0 4px;font-size:clamp(22px,3vw,30px);text-wrap:balance}
.map .lead{color:var(--muted);margin:0 0 14px;max-width:70ch}
.map .scroller{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:6px}
.map svg{display:block;min-width:760px;width:100%;height:auto}
.map text{font-family:var(--font);fill:var(--ink)}
.map .layer rect{stroke-width:2}
.map .lk{cursor:pointer}
.map .lk:hover rect{stroke-width:4;filter:brightness(1.05)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ---------- mobile ---------- */
.scrim{display:none}
@media (max-width:840px){
  .work{grid-template-columns:1fr}
  .only-mobile{display:inline-flex}
  .pane.left{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);z-index:30;border-radius:0 var(--radius) var(--radius) 0;transform:translateX(-105%);transition:transform .2s ease}
  body.drawer-open .pane.left{transform:none}
  body.drawer-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
  .detail{padding:14px 14px 40px}
  .hero .big{width:60px;height:60px;font-size:32px;border-radius:16px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="iconbtn only-mobile" id="drawerBtn" aria-label="Open folders" title="Folders">📂</button>
    <div class="brand"><div class="logo">✦</div><div>NovaOS Explorer<small>a blueprint for a brand-new operating system</small></div></div>
    <div class="search">
      <span class="ico">🔍</span>
      <input id="search" type="search" placeholder="Search everything… (try “money”, “robot”, “kernel”)" aria-label="Search the system tree" autocomplete="off">
      <button class="clear" id="clearSearch" aria-label="Clear search" hidden>✕</button>
    </div>
    <div class="controls">
      <div class="seg sun" role="group" aria-label="Reading level">
        <button id="lvlKid" aria-pressed="true">🧒 Kid</button>
        <button id="lvlGrown" aria-pressed="false">🎓 Grown-up</button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="viewExplorer" aria-pressed="true">🗂️ Explorer</button>
        <button id="viewMap" aria-pressed="false">🕸️ How it connects</button>
      </div>
      <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark theme" title="Theme">🌗</button>
    </div>
  </header>

  <div class="work">
    <aside class="pane left" id="leftPane">
      <div class="pane-head">📁 Folders<span class="spacer"></span>
        <button id="expandAll">Expand all</button><button id="collapseAll">Collapse</button>
        <button class="only-mobile" id="drawerClose" aria-label="Close folders">✕</button>
      </div>
      <nav class="tree" id="tree" aria-label="System tree"></nav>
    </aside>
    <main class="pane right" id="rightPane">
      <div class="pane-head" id="rightHead">📄 Details<span class="spacer"></span><span id="countBadge" style="text-transform:none;letter-spacing:0;font-weight:500"></span></div>
      <section class="detail" id="detail"></section>
      <section class="map" id="mapView" hidden></section>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
</div>

<script>
(function(){
  // ---------- index ----------
  const byId=new Map(), parent=new Map(), folderOf=new Map(), depth=new Map(), inbound=new Map();
  (function walk(n,p,d,f){ byId.set(n.id,n); parent.set(n.id,p); depth.set(n.id,d); folderOf.set(n.id,f||n);
    n.children.forEach(c=>walk(c,n,d+1,f||(d===0?c:null))); })(ROOT,null,0,null);
  byId.forEach(n=>n.talksTo.forEach(t=>{ if(!byId.has(t)) console.warn("Unknown link",n.id,"->",t); (inbound.get(t)||inbound.set(t,[]).get(t)).push(n.id); }));
  const ALL=[...byId.values()];
  const hueOf=id=>{ const f=folderOf.get(id); return f&&f.hue!=null?f.hue:225; };
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- state ----------
  const state={sel:"nova", expanded:new Set(["nova"]), q:"", level:"kid", view:"explorer"};
  const $=id=>document.getElementById(id);
  const treeEl=$("tree"), detailEl=$("detail"), mapEl=$("mapView");
  try{ const l=localStorage.getItem("nova.level"); if(l==="kid"||l==="grown") state.level=l; }catch(e){}
  try{ const t=localStorage.getItem("nova.theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
  $("countBadge").textContent=ALL.length+" parts";

  // ---------- search ----------
  let visible=null; // Set of ids visible under search, or null
  function matches(n,q){ return (n.kidName+" "+n.grownName+" "+n.kid+" "+n.why+" "+n.example+" "+n.grownUp).toLowerCase().includes(q); }
  function applySearch(q){
    state.q=q.trim().toLowerCase(); $("clearSearch").hidden=!state.q;
    if(!state.q){ visible=null; renderTree(); return; }
    visible=new Set();
    ALL.forEach(n=>{ if(matches(n,state.q)){ let c=n; while(c){ visible.add(c.id); c=parent.get(c.id);} } });
    renderTree();
  }
  function hl(text){ if(!state.q) return esc(text); const i=text.toLowerCase().indexOf(state.q); if(i<0) return esc(text);
    return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+state.q.length))+"</mark>"+esc(text.slice(i+state.q.length)); }

  // ---------- tree ----------
  function renderTree(){
    const build=(n,top)=>{
      if(visible&&!visible.has(n.id)) return "";
      const has=n.children.length>0, open=visible?true:state.expanded.has(n.id);
      const kids=has&&open?`<ul role="group">${n.children.map(c=>build(c,false)).join("")}</ul>`:"";
      return `<li role="none" class="${top?"top-node":""}" style="--h:${hueOf(n.id)}">
        <div class="node" role="treeitem" tabindex="${n.id===state.sel?0:-1}" data-id="${n.id}" aria-selected="${n.id===state.sel}" ${has?`aria-expanded="${open}"`:""} aria-level="${depth.get(n.id)+1}">
          <span class="tw ${has?"":"leaf"}">${has?"▶":"•"}</span><span class="ic">${n.icon}</span>
          <span class="lbl"><span class="kid">${hl(n.kidName)}</span><span class="grown">${hl(n.grownName)}</span></span>
        </div>${kids}</li>`;
    };
    const html=`<ul role="tree" aria-label="NovaOS">${build(ROOT,false)}</ul>`;
    treeEl.innerHTML=(visible&&visible.size===0)?`<div class="empty">Nothing matches “${esc(state.q)}”. Try another word.</div>`:html;
    // mark top-level folders
    treeEl.querySelectorAll('.node[aria-level="2"]').forEach(el=>el.parentElement.classList.add("top-node"));
    const selEl=treeEl.querySelector(`.node[data-id="${state.sel}"]`); if(selEl) selEl.scrollIntoView({block:"nearest"});
  }
  treeEl.addEventListener("click",e=>{
    const node=e.target.closest(".node"); if(!node) return; const id=node.dataset.id;
    if(e.target.closest(".tw")&&byId.get(id).children.length){ toggle(id); return; }
    if(state.sel===id&&byId.get(id).children.length){ toggle(id); }
    select(id,{fromTree:true});
  });
  treeEl.addEventListener("keydown",e=>{
    const node=e.target.closest(".node"); if(!node) return; const id=node.dataset.id; const n=byId.get(id);
    const items=[...treeEl.querySelectorAll(".node")]; const i=items.indexOf(node);
    const focus=el=>{ if(el){ items.forEach(x=>x.tabIndex=-1); el.tabIndex=0; el.focus(); } };
    switch(e.key){
      case "ArrowDown": e.preventDefault(); focus(items[i+1]); break;
      case "ArrowUp": e.preventDefault(); focus(items[i-1]); break;
      case "ArrowRight": e.preventDefault(); if(n.children.length&&!state.expanded.has(id)&&!visible){ state.expanded.add(id); renderTree(); focus(treeEl.querySelector(`.node[data-id="${id}"]`)); } else focus(items[i+1]); break;
      case "ArrowLeft": e.preventDefault(); if(n.children.length&&state.expanded.has(id)&&!visible){ state.expanded.delete(id); renderTree(); focus(treeEl.querySelector(`.node[data-id="${id}"]`)); } else { const p=parent.get(id); if(p) focus(treeEl.querySelector(`.node[data-id="${p.id}"]`)); } break;
      case "Home": e.preventDefault(); focus(items[0]); break;
      case "End": e.preventDefault(); focus(items[items.length-1]); break;
      case "Enter": case " ": e.preventDefault(); select(id,{fromTree:true}); break;
      case "*": e.preventDefault(); n.children.forEach(c=>state.expanded.add(c.id)); state.expanded.add(id); renderTree(); focus(treeEl.querySelector(`.node[data-id="${id}"]`)); break;
    }
  });
  function toggle(id){ state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id); renderTree(); }
  $("expandAll").onclick=()=>{ ALL.forEach(n=>n.children.length&&state.expanded.add(n.id)); renderTree(); };
  $("collapseAll").onclick=()=>{ state.expanded=new Set(["nova"]); renderTree(); };

  // ---------- selection & detail ----------
  function select(id,opts={}){
    if(!byId.has(id)) id="nova";
    state.sel=id; let c=parent.get(id); while(c){ state.expanded.add(c.id); c=parent.get(c.id); }
    if(byId.get(id).children.length && !opts.fromTree) state.expanded.add(id);
    if(state.view!=="explorer") setView("explorer",true);
    renderTree(); renderDetail(); detailEl.scrollTop=0;
    try{ history.replaceState(null,"","#"+id); }catch(e){}
    if(!opts.fromTree){ const el=treeEl.querySelector(`.node[data-id="${id}"]`); if(el){ treeEl.querySelectorAll(".node").forEach(x=>x.tabIndex=-1); el.tabIndex=0; } }
    document.body.classList.remove("drawer-open");
  }
  const chip=id=>{ const t=byId.get(id); if(!t) return ""; return `<button class="chip" data-go="${id}"><span>${t.icon}</span>${esc(t.kidName)}<small>${esc(t.grownName)}</small></button>`; };
  function crumbs(id){ const path=[]; let c=byId.get(id); while(c){ path.unshift(c); c=parent.get(c.id); }
    return path.map((n,i)=> i===path.length-1?`<span class="here">${n.icon} ${esc(n.kidName)}</span>`:`<button data-go="${n.id}">${n.icon} ${esc(n.kidName)}</button><span class="sep">/</span>`).join(""); }
  function neighborSVG(n){
    const links=[...new Set([...n.talksTo,...(inbound.get(n.id)||[])])].filter(id=>byId.has(id)&&id!==n.id).slice(0,10);
    const p=parent.get(n.id); if(!links.length&&!p) return "";
    const W=720,H=300,cx=W/2,cy=H/2+10,R=Math.min(120,H/2-40);
    let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="How ${esc(n.kidName)} connects to its neighbors">`;
    const box=(x,y,w,h,t,id,hue,sub)=>`<g class="lk" data-go="${id}" style="--h:${hue}" tabindex="0" role="link" aria-label="${esc(t)}"><rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="10" fill="hsl(var(--h) var(--fs) var(--fl2))" stroke="hsl(var(--h) var(--fs) var(--fl))" stroke-width="2"/><text x="${x}" y="${y+(sub?-2:5)}" text-anchor="middle" font-size="13" font-weight="700">${esc(t)}</text>${sub?`<text x="${x}" y="${y+13}" text-anchor="middle" font-size="10" opacity=".7">${esc(sub)}</text>`:""}</g>`;
    if(p){ s+=`<line x1="${cx}" y1="${cy-52}" x2="${cx}" y2="${28}" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 4"/>`; s+=box(cx,24,Math.min(260,p.kidName.length*8+40),30,p.icon+" "+p.kidName,p.id,hueOf(p.id),"inside"); }
    links.forEach((id,i)=>{ const t=byId.get(id);
      const ang=(-Math.PI/2)+(Math.PI*2)*((i+0.5)/links.length); const rx=R+150, ry=R; const x=cx+Math.cos(ang)*rx, y=cy+Math.sin(ang)*ry;
      s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="2"/>`;
      s+=box(x,y,Math.min(190,t.kidName.length*7.5+36),32,t.icon+" "+t.kidName,id,hueOf(id),n.talksTo.includes(id)?"talks to":"talks to me"); });
    s+=`<g style="--h:${hueOf(n.id)}"><circle cx="${cx}" cy="${cy}" r="46" fill="hsl(var(--h) var(--fs) var(--fl2))" stroke="hsl(var(--h) var(--fs) var(--fl))" stroke-width="3"/><text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="30">${n.icon}</text></g>`;
    return s+`</svg>`;
  }
  function renderDetail(){
    const n=byId.get(state.sel), hue=hueOf(n.id), folder=folderOf.get(n.id), grown=state.level==="grown";
    const inb=(inbound.get(n.id)||[]).filter(id=>!n.talksTo.includes(id));
    detailEl.innerHTML=`
      <nav class="crumbs" aria-label="Path">${crumbs(n.id)}</nav>
      <div class="hero" style="--h:${hue}">
        <div class="big" aria-hidden="true">${n.icon}</div>
        <div><h1>${esc(n.kidName)}</h1><div class="gname">${esc(n.grownName)}</div>
        ${folder&&folder!==n?`<span class="folderpill">${folder.icon} ${esc(folder.kidName)}</span>`:""}</div>
      </div>
      <div class="cards">
        <div class="card kidcard"><h3>🧒 In kid words</h3><p>${esc(n.kid)}</p></div>
        <div class="card"><h3>⭐ Why it matters</h3><p>${esc(n.why)}</p></div>
        <div class="card"><h3>🌍 Real-world example</h3><p>${esc(n.example)}</p></div>
      </div>
      <details class="grown" ${grown?"open":""}><summary>🎓 For grown-ups${grown?"":" <span style='color:var(--muted);font-weight:500'>(tap to peek)</span>"}</summary><div class="body">${n.grownUp}</div></details>
      ${n.children.length?`<div class="sect"><h2>📁 Inside this folder (${n.children.length})</h2><div class="grid-files">${n.children.map(c=>`<button class="file" data-go="${c.id}"><span class="fi">${c.icon}</span><span class="fk">${esc(c.kidName)}</span><span class="fg">${esc(c.grownName)}</span>${c.children.length?`<span class="fc">📁 ${c.children.length} inside</span>`:""}</button>`).join("")}</div></div>`:""}
      ${n.talksTo.length?`<div class="sect"><h2>🔗 Talks to</h2><div class="chips">${n.talksTo.map(chip).join("")}</div></div>`:""}
      ${inb.length?`<div class="sect"><h2>📣 Talked about by</h2><div class="chips">${inb.map(chip).join("")}</div></div>`:""}
      ${(n.talksTo.length||parent.get(n.id))?`<div class="sect"><h2>🕸️ Neighbors</h2><div class="diagram">${neighborSVG(n)}</div></div>`:""}
    `;
  }
  document.addEventListener("click",e=>{ const go=e.target.closest("[data-go]"); if(go){ e.preventDefault(); select(go.dataset.go); } });
  document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-go][role=link]")){ e.preventDefault(); select(e.target.dataset.go); } });

  // ---------- map view ----------
  function mapSVG(){
    const W=1180; let y=16; const parts=[]; const LX=16, LW=690, XW=104, XG=12, XX0=LX+LW+20;
    const chipW=t=>Math.min(170,Math.round(t.length*6.6)+30);
    const lay=(id,title,ids,label)=>{ const n=byId.get(id); const hue=hueOf(id);
      let cx=LX+14, cy=y+38, h=0; const rows=[]; ids.forEach(cid=>{ const c=byId.get(cid); const t=c.icon+" "+c.kidName; const w=chipW(t); if(cx+w>LX+LW-10){ cx=LX+14; cy+=30; } rows.push({x:cx,y:cy,w,t,id:cid}); cx+=w+6; });
      h=(cy+30)-y+8;
      parts.push(`<g class="layer"><g class="lk" data-go="${id}" style="--h:${hue}"><rect x="${LX}" y="${y}" width="${LW}" height="${h}" rx="14" fill="hsl(var(--h) var(--fs) var(--fl2))" stroke="hsl(var(--h) var(--fs) var(--fl))"/><text x="${LX+14}" y="${y+22}" font-size="15" font-weight="800">${esc(title)}</text><text x="${LX+LW-14}" y="${y+22}" font-size="11" text-anchor="end" opacity=".7">${esc(label)}</text></g>
        ${rows.map(r=>`<g class="lk" data-go="${r.id}" style="--h:${hue}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="24" rx="8" fill="var(--panel)" stroke="hsl(var(--h) var(--fs) var(--fl))" stroke-width="1.5"/><text x="${r.x+r.w/2}" y="${r.y+16}" font-size="11.5" text-anchor="middle" font-weight="600">${esc(r.t.length>24?r.t.slice(0,23)+"…":r.t)}</text></g>`).join("")}</g>`);
      y+=h;
    };
    const arrow=(label)=>{ parts.push(`<g><line x1="${LX+LW/2}" y1="${y+2}" x2="${LX+LW/2}" y2="${y+26}" stroke="var(--muted)" stroke-width="2"/><polygon points="${LX+LW/2-6},${y+8} ${LX+LW/2+6},${y+8} ${LX+LW/2},${y+2}" fill="var(--muted)"/><text x="${LX+LW/2+12}" y="${y+18}" font-size="11" fill="var(--muted)">${esc(label)}</text></g>`); y+=28; };
    const yTop=y;
    lay("apps","📱 Apps",["browser","messages","calls","photos","media","notes","maps","store","games","school","health","wallet-app","files-app","settings","camera","studio"],"what you use every day");
    arrow("UI Kit · Scene API · Intents");
    lay("playground","🎠 3D World & UI (Playground)",["world","rooms","avatars","renderer","physics","netcode","voice","vr","flat","input","a11y"],"the desktop is a place");
    arrow("objects · events · permissions");
    lay("toybox","🧸 Services (Toy Box, sync, updates)",["objects","versions","sync","sharing","search-index","crdt","backups","trash","updates","audit","permissions"],"system services in user space");
    arrow("capabilities · IPC");
    lay("kernel","🧠 Kernel (Engine Room)",["kernel","scheduler","memory","ipc","sandbox","boot","drivers"],"small, capability-secure core");
    arrow("device drivers");
    lay("engine","🔩 Hardware",["gpu","storage","power","sensors","audio-hw","wifi","secure-enclave"],"chips, radios, batteries");
    const yBot=y;
    // cross-cutting bars
    const bars=[["locks","🔐 Locks & Keys",["identity","passkeys","permissions","encryption-rest","parental"]],["bridge","🌉 Bridge Protocol",["identity-addr","e2e","p2p","relays","realtime","gateway"]],["ledger","📒 Ledger Protocol",["wallets","transfers","approvals","receipts","bank-bridge","kyc"]],["robots","🤖 AI Harness",["assistant","agents","tools","memory-ai","rails","router"]]];
    bars.forEach((b,i)=>{ const x=XX0+i*(XW+XG); const hue=hueOf(b[0]); const h=yBot-yTop;
      parts.push(`<g class="lk" data-go="${b[0]}" style="--h:${hue}"><rect x="${x}" y="${yTop}" width="${XW}" height="${h}" rx="12" fill="hsl(var(--h) var(--fs) var(--fl2))" stroke="hsl(var(--h) var(--fs) var(--fl))" stroke-width="2"/><text transform="translate(${x+XW/2},${yTop+h-12}) rotate(-90)" font-size="13" font-weight="800" text-anchor="start">${esc(b[1])}</text></g>`);
      b[2].forEach((cid,j)=>{ const c=byId.get(cid); parts.push(`<g class="lk" data-go="${cid}" style="--h:${hue}"><rect x="${x+6}" y="${yTop+10+j*40}" width="${XW-12}" height="34" rx="8" fill="var(--panel)" stroke="hsl(var(--h) var(--fs) var(--fl))" stroke-width="1.5"/><text x="${x+XW/2}" y="${yTop+10+j*40+15}" font-size="15" text-anchor="middle">${c.icon}</text><text x="${x+XW/2}" y="${yTop+10+j*40+28}" font-size="9.5" text-anchor="middle" font-weight="600">${esc(c.kidName.length>17?c.kidName.slice(0,16)+"…":c.kidName)}</text></g>`); });
    });
    y+=14;
    // platforms strip
    const plats=["phone","laptop","desktop","tablet","web","console","vr-headset","car","tv","watch"]; const pw=(W-32-9*8)/10;
    parts.push(`<g class="lk" data-go="platforms" style="--h:${hueOf("platforms")}"><rect x="16" y="${y}" width="${W-32}" height="78" rx="14" fill="hsl(var(--h) var(--fs) var(--fl2))" stroke="hsl(var(--h) var(--fs) var(--fl))" stroke-width="2"/><text x="30" y="${y+20}" font-size="14" font-weight="800">🗺️ Where it runs — one codebase, every device</text></g>`);
    plats.forEach((pid,i)=>{ const c=byId.get(pid); const x=16+i*(pw+8); parts.push(`<g class="lk" data-go="${pid}" style="--h:${hueOf("platforms")}"><rect x="${x+4}" y="${y+30}" width="${pw}" height="40" rx="8" fill="var(--panel)" stroke="hsl(var(--h) var(--fs) var(--fl))" stroke-width="1.5"/><text x="${x+4+pw/2}" y="${y+48}" font-size="16" text-anchor="middle">${c.icon}</text><text x="${x+4+pw/2}" y="${y+64}" font-size="10" text-anchor="middle" font-weight="600">${esc(c.grownName.length>16?c.kidName:c.grownName)}</text></g>`); });
    y+=92;
    // bottom row: workshop, rulebook, roadmap
    const bw=(W-32-16)/3;
    [["workshop","🛠️ Builder's Workshop","SDK, IDEs, store review"],["rulebook","📜 Rulebook","open standards, privacy, governance"],["roadmap","🛤️ Roadmap","4 phases, borrow open source"]].forEach((b,i)=>{ const x=16+i*(bw+8);
      parts.push(`<g class="lk" data-go="${b[0]}" style="--h:${hueOf(b[0])}"><rect x="${x}" y="${y}" width="${bw}" height="54" rx="12" fill="hsl(var(--h) var(--fs) var(--fl2))" stroke="hsl(var(--h) var(--fs) var(--fl))" stroke-width="2"/><text x="${x+14}" y="${y+22}" font-size="14" font-weight="800">${esc(b[1])}</text><text x="${x+14}" y="${y+41}" font-size="11" opacity=".75">${esc(b[2])}</text></g>`); });
    y+=70;
    return `<svg viewBox="0 0 ${W} ${y}" role="img" aria-label="NovaOS layer map">${parts.join("")}</svg>`;
  }
  function renderMap(){
    mapEl.innerHTML=`<h1>🕸️ How it all connects</h1><p class="lead">Read it from the bottom up: chips and radios at the bottom, the Brain on top of them, then the services that keep your stuff safe, then the 3D Playground, then the apps you touch. The four tall bars on the right run through every layer. Tap anything to open it.</p>
      <div class="scroller">${mapSVG()}</div>
      <div class="legend"><span><i style="background:hsl(215 var(--fs) var(--fl))"></i>Engine Room</span><span><i style="background:hsl(350 var(--fs) var(--fl))"></i>Locks & Keys</span><span><i style="background:hsl(35 var(--fs) var(--fl))"></i>Toy Box</span><span><i style="background:hsl(190 var(--fs) var(--fl))"></i>Post Office</span><span><i style="background:hsl(140 var(--fs) var(--fl))"></i>Piggy Bank</span><span><i style="background:hsl(280 var(--fs) var(--fl))"></i>Playground</span><span><i style="background:hsl(255 var(--fs) var(--fl))"></i>Robot Helpers</span><span><i style="background:hsl(95 var(--fs) var(--fl))"></i>Apps</span></div>`;
  }
  function setView(v,silent){
    state.view=v; $("viewExplorer").setAttribute("aria-pressed",v==="explorer"); $("viewMap").setAttribute("aria-pressed",v==="map");
    detailEl.hidden=v!=="explorer"; mapEl.hidden=v!=="map"; $("rightHead").firstChild.textContent=v==="map"?"🕸️ Layer map":"📄 Details";
    if(v==="map") renderMap();
  }
  $("viewExplorer").onclick=()=>setView("explorer"); $("viewMap").onclick=()=>setView("map");

  // ---------- level, theme, search, drawer ----------
  function setLevel(l){ state.level=l; document.body.dataset.level=l; $("lvlKid").setAttribute("aria-pressed",l==="kid"); $("lvlGrown").setAttribute("aria-pressed",l==="grown"); try{localStorage.setItem("nova.level",l);}catch(e){} renderDetail(); }
  $("lvlKid").onclick=()=>setLevel("kid"); $("lvlGrown").onclick=()=>setLevel("grown");
  $("themeBtn").onclick=()=>{ const r=document.documentElement; const cur=r.dataset.theme||"system"; const next=cur==="system"?"light":cur==="light"?"dark":"system";
    if(next==="system") delete r.dataset.theme; else r.dataset.theme=next; $("themeBtn").textContent=next==="light"?"☀️":next==="dark"?"🌙":"🌗"; $("themeBtn").title="Theme: "+next; try{ next==="system"?localStorage.removeItem("nova.theme"):localStorage.setItem("nova.theme",next);}catch(e){} };
  (function(){ const t=document.documentElement.dataset.theme; if(t) $("themeBtn").textContent=t==="light"?"☀️":"🌙"; })();
  let st; $("search").addEventListener("input",e=>{ clearTimeout(st); st=setTimeout(()=>applySearch(e.target.value),80); });
  $("search").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const first=treeEl.querySelector(".node mark"); if(first){ select(first.closest(".node").dataset.id); } } if(e.key==="Escape"){ e.target.value=""; applySearch(""); } });
  $("clearSearch").onclick=()=>{ $("search").value=""; applySearch(""); $("search").focus(); };
  $("drawerBtn").onclick=()=>document.body.classList.add("drawer-open");
  $("drawerClose").onclick=()=>document.body.classList.remove("drawer-open");
  $("scrim").onclick=()=>document.body.classList.remove("drawer-open");
  document.addEventListener("keydown",e=>{ if(e.key==="/"&&!/input|textarea/i.test(e.target.tagName)){ e.preventDefault(); $("search").focus(); } if(e.key==="Escape") document.body.classList.remove("drawer-open"); });
  window.addEventListener("hashchange",()=>{ const id=location.hash.slice(1); if(id&&byId.has(id)&&id!==state.sel) select(id); });

  // ---------- boot ----------
  document.body.dataset.level=state.level; $("lvlKid").setAttribute("aria-pressed",state.level==="kid"); $("lvlGrown").setAttribute("aria-pressed",state.level==="grown");
  const start=location.hash.slice(1); select(byId.has(start)?start:"nova");
  window.NOVA={nodes:ALL,byId,ROOT};
})();
</script>
